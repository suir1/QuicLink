version: '3.8'

services:
  quiclink:
    image: ghcr.io/suir1/quiclink:latest
    container_name: quiclink-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "443:8080"
    volumes:
      - ./src/server/config.json:/app/config.json
      - ./uploads:/app/uploads
      # Mount SSL certificates (optional, required if using HTTPS)
      - ./cert.pem:/app/cert.pem
      - ./key.pem:/app/key.pem
    environment:
      - TZ=Asia/Shanghai
